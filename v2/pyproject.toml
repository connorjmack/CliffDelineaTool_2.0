[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cliff-dl"
version = "2.0.0"
description = "Deep learning cliff delineation from elevation transects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Connor J Mack"}
]
# Lower bounds are the versions the published model was trained with; requirements.txt pins
# that environment exactly.
dependencies = [
    "torch>=2.9,<3",
    "numpy>=2.4,<3",
    "pandas>=2.3,<3",
    "scikit-learn>=1.8,<2",
    "statsmodels>=0.14,<1",
    "pyyaml>=6.0,<7",
    "tqdm>=4.67,<5",
    "tensorboard>=2.20,<3",
    "geopandas>=1.1,<2",
    "shapely>=2.1,<3",
    "rasterio>=1.4,<2",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<1",
    "pillow>=12.0,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
]

[project.urls]
Repository = "https://github.com/connorjmack/CliffDelineaTool_2.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["cliff_dl*"]

[tool.setuptools.package-data]
cliff_dl = ["*.yaml", "*.yml"]
