[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cliff-dl"
version = "2.0.0"
description = "Deep learning cliff delineation from elevation transects"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Coastal Research Lab"}
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "statsmodels>=0.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cliff_dl*"]

[tool.setuptools.package-data]
cliff_dl = ["*.yaml", "*.yml"]
